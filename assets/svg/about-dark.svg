<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" fill="none" role="img" aria-label="About Me. Frontend &amp; UI/UX: Building responsive, fast, and interactive web applications (React / TS / Tailwind). Personal: Musicaholic. Backend &amp; Tooling: Writing Python scripts, automation workflows, and lightweight serverless APIs. Audio &amp; Media: Passionate about web music players, custom components, and media streaming. Hardware &amp; Benchmarking: Deep diving into PC cooling, GPU tuning, and system optimization.">
