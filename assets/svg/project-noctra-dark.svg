<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" fill="none" role="img" aria-label="NOCTRA — MUSIC WORKSPACE. A desktop-style music workspace with YouTube, Audius and Telegram sources, Supabase profiles, listening stats and an Android build via Capacitor. Technologies: React 19, TypeScript, Tailwind, Supabase, Capacitor.">
<defs><linearGradient id="project-card" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#1B1527"/><stop offset="1" stop-color="#120D1B"/></linearGradient>
<linearGradient id="project-art" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#241B36"/><stop offset="0.6" stop-color="#120D1B"/><stop offset="1" stop-color="#120D1B"/></linearGradient>
<linearGradient id="project-glyph" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#C6A6FF"/><stop offset="1" stop-color="#8D5CF6"/></linearGradient>
<linearGradient id="project-rim" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="rgba(198,166,255,0.55)"/><stop offset="1" stop-color="rgba(141,92,246,0.15)"/></linearGradient>
<radialGradient id="project-glow" gradientUnits="userSpaceOnUse" cx="150" cy="150" r="126">
  <stop stop-color="#8D5CF6" stop-opacity="0.42"/>
  <stop offset="0.55" stop-color="#8D5CF6" stop-opacity="0.1596"/>
  <stop offset="1" stop-color="#8D5CF6" stop-opacity="0"/>
</radialGradient>
<pattern id="project-dots" width="18" height="18" patternUnits="userSpaceOnUse">
  <circle cx="1" cy="1" r="1" fill="rgba(169,135,232,0.16)"/>
</pattern>
<linearGradient id="project-dot-fade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="project-dot-mask"><rect width="300" height="300" fill="url(#project-dot-fade)"/></mask>
<clipPath id="project-art-clip"><path d="M28 0H300V300H28A28 28 0 0 1 0 272V28A28 28 0 0 1 28 0Z"/></clipPath>
<mask id="moon-cut"><circle cx="150" cy="150" r="46" fill="#fff"/><circle cx="169" cy="135" r="43" fill="#000"/></mask></defs>
<style>
  text { font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .display { font-family: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .enter { animation: enter 0.8s cubic-bezier(0.22, 0.68, 0, 1) backwards; }
  .fade { animation: fade 1s ease backwards; }
  .float { animation: float 8s ease-in-out infinite; }
  .float-slow { animation: float 12s ease-in-out infinite; }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 11s ease-in-out infinite; }
  .spin { transform-box: view-box; transform-origin: 215px 224px; animation: spin 52s linear infinite; }
  .pulse { animation: pulse 7s ease-in-out infinite; }
  .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
  @keyframes eq { 0%, 100% { transform: scaleY(0.32); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .enter, .fade, .float, .float-slow, .breathe, .spin, .pulse, .eq { animation: none !important; }
  }
</style>

