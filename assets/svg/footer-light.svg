<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" fill="none" role="img" aria-label="Thanks for stopping by. Built with care, code and a lot of music. © 2026 Sqwer">
<defs><linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#7548C9" stop-opacity="0"/><stop offset="0.5" stop-color="#7548C9" stop-opacity="0.35"/><stop offset="1" stop-color="#7548C9" stop-opacity="0"/></linearGradient>
<linearGradient id="footer-mono" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#EEE4FB"/><stop offset="1" stop-color="#EFE6FA"/></linearGradient>
<radialGradient id="footer-glow" gradientUnits="userSpaceOnUse" cx="440" cy="150" r="300">
  <stop stop-color="#5F35B8" stop-opacity="0.08"/>
  <stop offset="0.55" stop-color="#5F35B8" stop-opacity="0.0304"/>
  <stop offset="1" stop-color="#5F35B8" stop-opacity="0"/>
</radialGradient>
<radialGradient id="footer-halo" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#8D5CF6" stop-opacity="0.14"/><stop offset="1" stop-color="#8D5CF6" stop-opacity="0"/></radialGradient></defs>
<style>
  text { font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .display { font-family: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .enter { animation: enter 0.8s cubic-bezier(0.22, 0.68, 0, 1) backwards; }
  .fade { animation: fade 1s ease backwards; }
  .float { animation: float 8s ease-in-out infinite; }
  .float-slow { animation: float 12s ease-in-out infinite; }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 11s ease-in-out infinite; }
  .spin { transform-box: view-box; transform-origin: 215px 224px; animation: spin 52s linear infinite; }
  .pulse { animation: pulse 7s ease-in-out infinite; }
  .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
  @keyframes eq { 0%, 100% { transform: scaleY(0.32); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .enter, .fade, .float, .float-slow, .breathe, .spin, .pulse, .eq { animation: none !important; }
  }
</style>

<path d="M44 1H836" stroke="url(#footer-line)"/>
<rect width="880" height="150" fill="url(#footer-glow)"/>
<circle cx="440" cy="44" r="46" fill="url(#footer-halo)"/>
<rect x="421" y="25" width="38" height="38" rx="13" fill="url(#footer-mono)" stroke="rgba(117,72,201,0.21)"/>
<text x="440" y="51" text-anchor="middle" class="display" font-size="18" font-weight="700" fill="#8D5CF6">S</text>
<text x="440" y="93" text-anchor="middle" class="display" font-size="22" font-weight="600" letter-spacing="-0.2" fill="#181124">Thanks for stopping by.</text>
<text x="440" y="115" text-anchor="middle" font-size="11" fill="#5E5470">Built with care, code and a lot of music.</text>
<text x="440" y="137" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#6F637F" opacity="0.8">© 2026 SQWER</text>
<circle cx="356" cy="94" r="1.6" fill="#7548C9" opacity="0.45"/>
<circle cx="524" cy="94" r="1.6" fill="#7548C9" opacity="0.45"/>

</svg>
